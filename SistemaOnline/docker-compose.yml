services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    volumes:
      - db_data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 15
 
  web:
    build:
      context: ..
      dockerfile: SistemaOnline/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__SQLCadena: "Server=db;Database=SistemaDB;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True"
    ports:
      - "8080:8080"
 
volumes:
  db_data:
